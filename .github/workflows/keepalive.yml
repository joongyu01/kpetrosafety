# ═══════════════════════════════════════════════════════════════════════════
#  Supabase 휴면 방지 (keep-alive)
#
#  무료 요금제 프로젝트는 7일간 활동이 적으면 일시정지된다.
#  공식 문서 기준: "하루에 몇 건의 요청이면 일시정지를 막기에 충분하다."
#    https://supabase.com/docs/guides/platform/free-project-pausing
#  그래서 '하루 한 번'이 아니라 하루 2회 × 매회 3건 = 하루 6건을 보낸다.
#  (예약 작업이 한 번 걸러져도 나머지 한 번이 그날을 메운다)
#
#  · 수동 실행: Actions 탭 → 이 워크플로 → Run workflow
#  · 실패하면 GitHub 가 저장소 소유자에게 메일을 보낸다.
# ═══════════════════════════════════════════════════════════════════════════
name: Supabase 휴면 방지

on:
  schedule:
    - cron: "17 21 * * *"          # 21:17 UTC = 다음날 06:17 KST
    - cron: "17 9 * * *"           # 09:17 UTC = 같은날 18:17 KST
  workflow_dispatch:                # 손으로도 돌릴 수 있게

permissions:
  contents: write                   # 아래 '저장소 활동 갱신' 단계에서 필요

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 접속 정보는 config.js 를 그대로 쓴다(단일 출처).
      # 저장소 시크릿 SUPABASE_URL / SUPABASE_ANON_KEY 를 넣어두면 그쪽이 우선.
      # ※ anon(sb_publishable_) 키는 원래 공개용이라 config.js 에 있어도 된다.
      #    service_role(sb_secret_) 키는 여기에도, 시크릿에도 넣지 말 것.
      - name: 접속 정보 읽기
        id: cfg
        env:
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="${SECRET_URL:-$(sed -n 's/.*SUPABASE_URL:[^"]*"\([^"]*\)".*/\1/p' config.js | head -1)}"
          KEY="${SECRET_KEY:-$(sed -n 's/.*SUPABASE_ANON_KEY:[^"]*"\([^"]*\)".*/\1/p' config.js | head -1)}"
          URL="${URL%/}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::config.js 에서 Supabase 접속 정보를 찾지 못했습니다."
            exit 1
          fi
          echo "대상 $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: 심박 보내기
        env:
          URL: ${{ steps.cfg.outputs.url }}
          KEY: ${{ steps.cfg.outputs.key }}
        run: |
          set -uo pipefail
          STAMP=$(date -u +%m%dT%H%MZ)
          LAST_CODE=000
          LAST_BODY=""

          # 한 번 보내고 성공이면 0 을 돌려준다
          send() {
            LAST_CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 30 \
              -X POST "$URL/rest/v1/rpc/sr_ping" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"p_note\":\"$1\"}") || LAST_CODE=000
            LAST_BODY=$(cat body.txt 2>/dev/null || true)
            [ "$LAST_CODE" = "200" ] && echo "$LAST_BODY" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'
          }

          OK=0
          for n in 1 2 3; do
            for try in 1 2 3; do
              if send "gh-$STAMP-$n"; then
                OK=$((OK + 1))
                echo "[$n/3] 성공 · $LAST_BODY"
                break
              fi
              echo "[$n/3] 시도 $try 실패 · HTTP $LAST_CODE · $LAST_BODY"
              [ "$try" != "3" ] && sleep 20
            done
            [ "$n" != "3" ] && sleep 5
          done

          {
            if [ "$OK" -eq 3 ]; then echo "### ✅ 심박 3/3 성공";
            elif [ "$OK" -ge 1 ]; then echo "### ⚠️ 심박 $OK/3 성공 — DB 는 살아 있음";
            else echo "### ❌ 심박 0/3 — HTTP $LAST_CODE"; fi
            echo ''
            echo '```json'
            echo "${LAST_BODY:-<응답 없음>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OK" -eq 0 ]; then
            echo "::error::Supabase 심박 전부 실패 (HTTP $LAST_CODE). 프로젝트가 일시정지됐거나 sr_ping 이 아직 없을 수 있습니다."
            exit 1
          fi
          if [ "$OK" -lt 3 ]; then
            echo "::warning::심박 $OK/3 만 성공했습니다. 연속으로 이러면 프로젝트 상태를 확인하세요."
          fi

      # GitHub 은 '저장소에 60일간 아무 활동이 없으면' 예약 워크플로를 자동으로 꺼 버린다.
      # 그러면 심박도 같이 멈춘다. 그래서 25일에 한 번 날짜 파일을 갱신해 활동을 남긴다.
      # 저장소의 Actions 토큰이 읽기 전용이면 여기서 막히지만, 심박 자체는 이미 끝났으므로
      # 작업을 실패로 만들지 않는다.
      - name: 저장소 활동 갱신
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          set -euo pipefail
          STAMP=.github/keepalive-stamp.txt
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(head -1 "$STAMP" 2>/dev/null | tr -dc '0-9-' || true)
          DAYS=999
          if [ -n "$LAST" ]; then
            DAYS=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$LAST" +%s) ) / 86400 )) || DAYS=999
          fi
          echo "마지막 기록 ${LAST:-없음} · ${DAYS}일 전"
          if [ "$DAYS" -lt 25 ]; then
            echo "아직 갱신할 때가 아닙니다."
            exit 0
          fi
          mkdir -p .github
          printf '%s\n' "$TODAY" > "$STAMP"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STAMP"
          git commit -m "휴면 방지: 저장소 활동 기록 $TODAY"
          git push || { git pull --rebase --autostash && git push; }
